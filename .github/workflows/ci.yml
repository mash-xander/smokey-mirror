name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SmokeyMirror-windows-x64
          path: dist/
